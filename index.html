<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>新竹 → 嘉義｜2026/9/19–9/20 景點互動地圖</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}
body{overflow:hidden;background:#eef2f5}
#map{width:100%;touch-action:none}
.topbar{position:absolute;z-index:10;top:12px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-radius:16px;padding:10px 12px;box-shadow:0 5px 20px #0002;box-sizing:border-box}
.title{font-weight:800;font-size:16px} .sub{font-size:12px;color:#555;margin-top:2px}
.filters{display:flex;gap:6px;overflow:auto;margin-top:8px;scrollbar-width:none} .filters::-webkit-scrollbar{display:none}
.filters button{white-space:nowrap;border:0;border-radius:999px;padding:7px 10px;background:#edf0f3;font-weight:650;cursor:pointer}
.filters button.active{background:#222;color:#fff}
.popup{position:absolute;background:white;border-radius:14px;box-shadow:0 6px 25px #0003;padding:13px;width:min(300px,calc(100vw - 42px));transform:translate(-50%,-100%);margin-top:-13px;display:none;z-index:20}
.popup:after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:white;border-bottom:0}
.popup b{display:block;font-size:15px;line-height:1.35;padding-right:20px} .popup .meta{font-size:12px;color:#666;margin:5px 0} .popup .desc{font-size:13px;line-height:1.45}
.popup a{display:inline-block;margin-top:9px;text-decoration:none;background:#111;color:#fff;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:700}
.popup-actions{display:flex;gap:7px;flex-wrap:wrap}
.popup button.detail-btn{margin-top:9px;border:0;background:#e9eef5;color:#1d3557;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.popup button.detail-btn:hover{background:#dce6f2}
.close{position:absolute;right:9px;top:7px;border:0;background:transparent;font-size:20px;cursor:pointer}
.legend{position:absolute;z-index:9;left:10px;bottom:12px;background:#fffffff0;border-radius:12px;padding:8px 10px;font-size:11px;box-shadow:0 3px 14px #0002}
.ol-zoom{top:auto!important;left:auto!important;right:10px!important;bottom:64px!important}
.ol-zoom button{width:38px!important;height:38px!important;font-size:22px!important}
.ol-attribution{font-size:10px}

/* 定位按鈕與呼吸燈浮層 */
.locate-btn{position:absolute;right:10px;bottom:14px;z-index:9;width:38px;height:38px;border-radius:8px;background:#fff;border:none;box-shadow:0 2px 8px #0003;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333;transition:all .2s ease}
.locate-btn:hover{background:#f0f0f0}
.locate-btn.active{color:#007aff;background:#eef6ff}
.locate-btn svg{width:20px;height:20px}

.location-marker{position:relative;width:20px;height:20px;pointer-events:auto;cursor:pointer}
.location-dot{position:absolute;top:50%;left:50%;width:14px;height:14px;background:#007aff;border:2.5px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(0,122,255,.5);z-index:2}
.location-pulse{position:absolute;top:50%;left:50%;width:14px;height:14px;background:rgba(0,122,255,.45);border-radius:50%;transform:translate(-50%,-50%);animation:pulse 2s infinite ease-out;z-index:1}

@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);opacity:0.9}
  70%{transform:translate(-50%,-50%) scale(3.5);opacity:0.0}
  100%{transform:translate(-50%,-50%) scale(3.5);opacity:0.0}
}

.modal-backdrop{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(18,28,40,.48);backdrop-filter:blur(4px)}
.modal-backdrop.open{display:flex}
.travel-modal{position:relative;width:min(560px,100%);max-height:min(720px,calc(100vh - 36px));overflow:auto;background:#fff;border-radius:22px;box-shadow:0 20px 60px #0005;padding:24px;box-sizing:border-box}
.travel-modal h2{margin:0 32px 7px 0;font-size:22px;line-height:1.3}
.travel-modal .modal-kicker{margin:0 0 16px;color:#64748b;font-size:13px;font-weight:700}
.travel-modal .modal-copy{font-size:15px;line-height:1.7;color:#273444;white-space:pre-line}
.travel-modal .modal-meta{margin:18px 0 0;padding:13px 14px;background:#f5f7fa;border-radius:12px;font-size:13px;line-height:1.65;color:#475569}
.travel-modal .modal-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.travel-modal .modal-links a{display:inline-block;text-decoration:none;background:#111;color:#fff;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700}
.travel-modal .modal-links a.secondary{background:#e9eef5;color:#1d3557}
.modal-close{position:absolute;right:13px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:#f1f4f7;color:#334155;font-size:24px;line-height:1;cursor:pointer}
.modal-close:hover{background:#e2e8f0}
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar"><div class="title">新竹 → 嘉義｜這週末景點</div><div class="sub">2026/9/19–9/20 · 點標記看資訊，再開 Google Maps 研究路線</div><div class="filters" id="filters"></div></div>
<div class="legend">拖曳・縮放看地圖｜放大後顯示景點名稱</div>

<!-- 定位按鈕 -->
<button class="locate-btn" id="locateBtn" title="定位當前位置" aria-label="定位當前位置">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
  </svg>
</button>

<!-- 呼吸燈定位 DOM 標記 -->
<div id="userLocationOverlay" class="location-marker" style="display:none" title="我的目前位置">
  <div class="location-pulse"></div>
  <div class="location-dot"></div>
</div>

<div id="popup" class="popup"><button class="close" id="close" aria-label="關閉提示">×</button><b id="pn"></b><div class="meta" id="pm"></div><div class="desc" id="pd"></div><div class="popup-actions"><button id="pdetails" class="detail-btn" type="button">旅遊介紹</button><a id="plink" target="_blank" rel="noopener">Google Maps →</a></div></div>

<div id="travelModal" class="modal-backdrop" role="presentation">
  <article class="travel-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalCopy">
    <button id="modalClose" class="modal-close" type="button" aria-label="關閉旅遊介紹">×</button>
    <p id="modalKicker" class="modal-kicker"></p>
    <h2 id="modalTitle"></h2>
    <div id="modalCopy" class="modal-copy"></div>
    <div id="modalMeta" class="modal-meta"></div>
    <div class="modal-links"><a id="modalMapLink" target="_blank" rel="noopener">在 Google Maps 開啟</a><a id="modalOfficialLink" class="secondary" target="_blank" rel="noopener">官方／參考連結</a></div>
  </article>
</div>

<script>
let places=[];
const palette={"本週活動":"#e53935","單車":"#1976d2","單車/風景":"#1976d2","風景":"#2e7d32","生態":"#16805b","步道":"#2f6f45","景點":"#6a1b9a","人文":"#8a4b18","嘉義晚上":"#ef6c00","美食":"#c2410c","咖啡":"#5d4037"};
async function loadPlaces(){
  const response=await fetch("./places.json");
  if(!response.ok) throw new Error("places.json 載入失敗（HTTP "+response.status+"）");
places=await response.json();
const labelResolution=180;
function placeStyle(p,resolution){
 const showLabel=resolution<=labelResolution;
 return new ol.style.Style({
   image:new ol.style.Circle({radius:9,fill:new ol.style.Fill({color:palette[p.type]||"#333"}),stroke:new ol.style.Stroke({color:"#fff",width:3})}),
   text:showLabel?new ol.style.Text({
     text:p.name,
     font:'600 12px system-ui,-apple-system,"Noto Sans TC",sans-serif',
     offsetY:-19,
     padding:[3,5,3,5],
     backgroundFill:new ol.style.Fill({color:"rgba(255,255,255,.92)"}),
     backgroundStroke:new ol.style.Stroke({color:"rgba(30,41,59,.16)",width:1}),
     fill:new ol.style.Fill({color:"#1e293b"}),
     stroke:new ol.style.Stroke({color:"#fff",width:3}),
     overflow:false
   }):undefined
 });
}
const source=new ol.source.Vector();
function makeFeature(p){
 const f=new ol.Feature({geometry:new ol.geom.Point(ol.proj.fromLonLat([p.lon,p.lat])),...p});
 f.setStyle((feature,resolution)=>placeStyle(feature.getProperties(),resolution));
 return f;
}
places.forEach(p=>source.addFeature(makeFeature(p)));
const vector=new ol.layer.Vector({source,declutter:true});

// 精度範圍圖層
const accuracySource=new ol.source.Vector();
const accuracyVector=new ol.layer.Vector({
  source:accuracySource,
  style:new ol.style.Style({
    fill:new ol.style.Fill({color:'rgba(0,122,255,0.08)'}),
    stroke:new ol.style.Stroke({color:'rgba(0,122,255,0.4)',width:1.5,lineDash:[4,4]})
  })
});

const base=new ol.layer.Tile({source:new ol.source.XYZ({
 url:"https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 attributions:'© OpenStreetMap contributors',
 crossOrigin:"anonymous",
 maxZoom:19
})});
const map=new ol.Map({
 target:"map",layers:[base,accuracyVector,vector],
 view:new ol.View({center:ol.proj.fromLonLat([120.62,24.15]),zoom:8.2,minZoom:7,maxZoom:18,constrainResolution:false}),
 controls:ol.control.defaults.defaults({rotate:false,zoom:true,attribution:true}),
 interactions:ol.interaction.defaults.defaults({mouseWheelZoom:true,pinchZoom:true,dragPan:true})
});

// 景點資訊彈窗
const el=document.getElementById("popup");
const overlay=new ol.Overlay({element:el,positioning:"bottom-center",stopEvent:true,autoPan:{animation:{duration:180},margin:60}});
map.addOverlay(overlay);
let selectedPlace=null;
const detailButton=document.getElementById("pdetails");
const travelModal=document.getElementById("travelModal");
const modalClose=document.getElementById("modalClose");

function show(f){
 const p=f.getProperties(); selectedPlace=p; document.getElementById("pn").textContent=p.name;
 document.getElementById("pm").textContent=p.city+" · "+p.type;
 document.getElementById("pd").textContent=p.desc;
 document.getElementById("plink").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.q);
 detailButton.style.display=p.intro?"inline-block":"none";
 overlay.setPosition(f.getGeometry().getCoordinates()); el.style.display="block";
}
map.on("singleclick",e=>{const f=map.forEachFeatureAtPixel(e.pixel,x=>x,{hitTolerance:8,layerFilter:l=>l===vector}); if(f)show(f); else{el.style.display="none";overlay.setPosition(undefined)}});
map.on("pointermove",e=>{map.getTargetElement().style.cursor=map.hasFeatureAtPixel(e.pixel,{hitTolerance:5,layerFilter:l=>l===vector})?"pointer":""});
document.getElementById("close").onclick=()=>{el.style.display="none";overlay.setPosition(undefined)};

function openTravelModal(){
  if(!selectedPlace || !selectedPlace.intro) return;
  document.getElementById("modalKicker").textContent=selectedPlace.city+" · "+selectedPlace.type;
  document.getElementById("modalTitle").textContent=selectedPlace.name;
  document.getElementById("modalCopy").textContent=selectedPlace.intro;
  document.getElementById("modalMeta").textContent="地址："+selectedPlace.address+"\n提醒："+selectedPlace.hours;
  document.getElementById("modalMapLink").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(selectedPlace.q);
  document.getElementById("modalOfficialLink").href=selectedPlace.officialUrl;
  travelModal.classList.add("open");
  modalClose.focus();
}
function closeTravelModal(){travelModal.classList.remove("open");detailButton.focus()}
detailButton.addEventListener("click",openTravelModal);
modalClose.addEventListener("click",closeTravelModal);
travelModal.addEventListener("click",e=>{if(e.target===travelModal)closeTravelModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape" && travelModal.classList.contains("open"))closeTravelModal()});

// 分類篩選
const types=["全部",...new Set(places.map(x=>x.type))];
const filters=document.getElementById("filters");
types.forEach((t,i)=>{
  const b=document.createElement("button");
  b.textContent=t;
  if(i===0) b.classList.add("active");
  b.addEventListener("click",()=>{
    Array.from(filters.children).forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    source.getFeatures().forEach(f=>{
      const visible=(t==="全部" || f.get("type")===t);
      f.setStyle(visible ? (feature,resolution)=>placeStyle(feature.getProperties(),resolution) : new ol.style.Style({}));
    });
    el.style.display="none";
    overlay.setPosition(undefined);
  });
  filters.appendChild(b);
});

// 當前位置 Overlay 與 Geolocation 設定
const locEl=document.getElementById("userLocationOverlay");
const locOverlay=new ol.Overlay({
  element:locEl,
  positioning:"center-center",
  stopEvent:false
});
map.addOverlay(locOverlay);

locEl.addEventListener("click",()=>{
  selectedPlace=null;
  detailButton.style.display="none";
  document.getElementById("pn").textContent="📍 我的目前位置";
  document.getElementById("pm").textContent="即時 GPS 定位";
  document.getElementById("pd").textContent="點擊右下角定位按鈕可重新定位或移至中心。";
  const pos=geolocation.getPosition();
  if(pos){
    const lonLat=ol.proj.toLonLat(pos);
    document.getElementById("plink").href=`https://www.google.com/maps/search/?api=1&query=${lonLat[1].toFixed(5)},${lonLat[0].toFixed(5)}`;
    overlay.setPosition(pos);
    el.style.display="block";
  }
});

const geolocation=new ol.Geolocation({
  trackingOptions:{enableHighAccuracy:true,timeout:10000},
  projection:map.getView().getProjection()
});

let firstTracking=true;
const locateBtn=document.getElementById("locateBtn");

function updateLocationDisplay(){
  const pos=geolocation.getPosition();
  if(!pos) return;
  locOverlay.setPosition(pos);
  locEl.style.display="block";

  // 更新精度圈
  accuracySource.clear();
  const accGeo=geolocation.getAccuracyGeometry();
  if(accGeo){
    accuracySource.addFeature(new ol.Feature(accGeo));
  }

  if(firstTracking){
    map.getView().animate({center:pos,zoom:13,duration:800});
    firstTracking=false;
  }
}

geolocation.on("change:position",updateLocationDisplay);
geolocation.on("change:accuracyGeometry",()=>{
  const accGeo=geolocation.getAccuracyGeometry();
  if(accGeo && locEl.style.display!=="none"){
    accuracySource.clear();
    accuracySource.addFeature(new ol.Feature(accGeo));
  }
});

geolocation.on("error",err=>{
  alert("無法取得您的位置："+(err.message||"請確認是否允許瀏覽器存取位置權限"));
  locateBtn.classList.remove("active");
});

locateBtn.addEventListener("click",()=>{
  if(!geolocation.getTracking()){
    firstTracking=true;
    geolocation.setTracking(true);
    locateBtn.classList.add("active");
  }else{
    const pos=geolocation.getPosition();
    if(pos){
      map.getView().animate({center:pos,zoom:14,duration:600});
    }
  }
});

// 頁面載入時自動嘗試定位一次
if(navigator.geolocation){
  geolocation.setTracking(true);
  locateBtn.classList.add("active");
}
}
loadPlaces().catch(error=>{
  console.error(error);
  alert("無法載入景點資料，請確認使用 HTTP 伺服器開啟頁面。");
});
</script>
</body>
</html>
